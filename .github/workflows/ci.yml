name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/core.test.js

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (outside the repo, so the site stays build-free)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.48.2
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Run smoke test
        run: PLAYWRIGHT_PATH="$RUNNER_TEMP/pw/node_modules/playwright" node tests/browser-smoke.js --shots "$RUNNER_TEMP/shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
